[server]
headless = true
enableXsrfProtection = true
enableCORS = true
# Odpovídá MAX_FILE_SIZE_MB v app.py (fotky z fotoaparátu i galerie)
maxUploadSize = 10
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Uživatelům se nezobrazují interní chyby a stack trace
showErrorDetails = "none"
